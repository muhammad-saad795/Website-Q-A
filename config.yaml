# =================================================================
# Website QA Tool - Configuration
# =================================================================
# Settings can be overridden by Environment Variables.
# Nested keys use double underscores: e.g. GEMINI__API_KEY
# =================================================================

gemini:
  model: "gemini-2.5-flash"
  max_steps: 15

browser:
  headless: true
  max_load_seconds: 60
  nav_timeout_ms: 30000
  settle_time_ms: 1000
  retries: 3
  viewports:
    desktop:
      width: 1920
      height: 1080
    mobile:
      width: 375
      height: 812

crawler:
  max_pages: null
  max_depth: null
  interactive: false
  output_dir: "crawl_results"

api:
  host: "0.0.0.0"
  port: 8000
  max_body_bytes: 262144  # 256 * 1024
  results_dir: "job_results"

logging_level: "INFO"
