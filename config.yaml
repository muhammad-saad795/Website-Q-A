# =================================================================
# Website QA Tool - Configuration
# =================================================================
# Settings can be overridden by Environment Variables.
# Nested keys use double underscores: e.g. GEMINI__API_KEY
# =================================================================

gemini:
  model: "gemini-2.5-flash"
  max_steps: 15

browser:
  headless: true
  max_load_seconds: 60
  nav_timeout_ms: 30000
  settle_time_ms: 1000
  retries: 3
  viewports:
    desktop:
      width: 1920
      height: 1080
    mobile:
      width: 375
      height: 812

logging_level: "INFO"
