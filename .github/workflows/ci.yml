name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify code compiles
        run: |
          python -m py_compile app.py qa_tool.py config.py src/*.py tools/*.py

      - name: Validate app boot config
        run: |
          python - <<'PY'
          from app import app
          assert app is not None
          print("Flask app import: OK")
          PY
