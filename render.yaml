services:
  - type: web
    name: website-qa-api
    runtime: python
    plan: starter
    region: oregon
    autoDeploy: true
    buildCommand: |
      pip install -r requirements.txt
      python -m playwright install chromium
    startCommand: |
      mkdir -p ${API__RESULTS_DIR:-/var/data/job_results} ${CRAWLER__OUTPUT_DIR:-/var/data/crawl_results}
      gunicorn -c gunicorn.conf.py app:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: API__RESULTS_DIR
        value: /var/data/job_results
      - key: CRAWLER__OUTPUT_DIR
        value: /var/data/crawl_results
      - key: WEB_CONCURRENCY
        value: "1"
      - key: PYTHON_VERSION
        value: 3.11.11
    disk:
      name: website-qa-data
      mountPath: /var/data
      sizeGB: 10
